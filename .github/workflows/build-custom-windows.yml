name: Build custom AyuGram (Windows x64)

on:
  workflow_dispatch:
  push:
    branches:
      - custom/message-shot

permissions:
  contents: read

concurrency:
  group: ayugram-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Release build
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      TBUILD: D:\TBuild
      REPO_NAME: ${{ github.event.repository.name }}
      SDK: 10.0.26100.0
      API_ID: '2040'
      API_HASH: b18441a1ff607e10a989891a5462e627
    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare build volume
        run: |
          if not exist D:\TBuild mkdir D:\TBuild
          if not exist D:\TBuild\Libraries mkdir D:\TBuild\Libraries
          if not exist D:\TBuild\Libraries\win64 mkdir D:\TBuild\Libraries\win64
          if not exist D:\TBuild\ThirdParty mkdir D:\TBuild\ThirdParty
          echo LibrariesPath=D:\TBuild\Libraries\win64>>"%GITHUB_ENV%"

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          submodules: false
          fetch-depth: 1

      - name: Move source to build volume
        run: |
          if exist "%TBUILD%\%REPO_NAME%" rmdir /s /q "%TBUILD%\%REPO_NAME%"
          move "%GITHUB_WORKSPACE%\source" "%TBUILD%\%REPO_NAME%"

      - name: Initialize submodules
        run: git -C "%TBUILD%\%REPO_NAME%" submodule update --init --depth=1

      - name: Compute dependency cache key
        shell: pwsh
        run: |
          $repo = Join-Path $env:TBUILD $env:REPO_NAME
          $prepare = (Get-FileHash (Join-Path $repo 'Telegram/build/prepare/prepare.py') -Algorithm SHA256).Hash
          $qt = (Get-FileHash (Join-Path $repo 'Telegram/build/qt_version.py') -Algorithm SHA256).Hash
          $submodules = (& git -C $repo submodule status) -join "`n"
          $material = "$prepare`n$qt`n$($env:SDK)`n$submodules"
          $inputFile = Join-Path $env:RUNNER_TEMP 'ayugram-dependency-cache-key.txt'
          [IO.File]::WriteAllText($inputFile, $material)
          $key = (Get-FileHash $inputFile -Algorithm SHA256).Hash.ToLowerInvariant().Substring(0, 24)
          "DEPENDENCY_KEY=$key" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore ThirdParty cache
        id: cache-thirdparty
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: D:\TBuild\ThirdParty
          key: ayugram-win64-thirdparty-${{ env.DEPENDENCY_KEY }}
          restore-keys: ayugram-win64-thirdparty-

      - name: Restore libraries cache
        id: cache-libraries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: D:\TBuild\Libraries\win64
          key: ayugram-win64-libraries-${{ env.DEPENDENCY_KEY }}
          restore-keys: ayugram-win64-libraries-

      - name: Install ATL for MSVC 14.44
        shell: pwsh
        run: |
          $installerDir = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installerDir 'vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }

          $toolsComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64'
          $atlComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL'
          $vsPath = @(& $vswhere -latest -products '*' -requires $toolsComponent -property installationPath)[0]
          if (-not $vsPath) { throw "No Visual Studio installation with $toolsComponent was found." }

          $toolset = Get-ChildItem (Join-Path $vsPath 'VC\Tools\MSVC') -Directory |
            Where-Object { $_.Name -like '14.44.*' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $toolset) { throw 'MSVC toolset 14.44 is missing from the runner.' }

          $header = Join-Path $toolset.FullName 'atlmfc\include\atlbase.h'
          if (-not (Test-Path $header)) {
            $installer = Join-Path $installerDir 'vs_installer.exe'
            if (-not (Test-Path $installer)) { $installer = Join-Path $installerDir 'setup.exe' }
            if (-not (Test-Path $installer)) { throw 'Visual Studio installer executable was not found.' }
            $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
              'modify', '--installPath', "`"$vsPath`"", '--add', $atlComponent,
              '--quiet', '--norestart', '--nocache'
            )
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Visual Studio Installer exited with $($process.ExitCode)."
            }
          }

          if (-not (Test-Path $header)) { throw "ATL header is still missing: $header" }

      - name: Select MSVC 14.44 and Windows SDK
        uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: Configure NuGet source
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Prepare AyuGram dependencies
        id: prepare
        run: call "%TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat" silent

      # Save immediately after dependency preparation so even a later C++
      # compile failure does not force the next run to rebuild Qt/libraries.
      - name: Save ThirdParty cache
        if: always() && steps.prepare.outcome == 'success' && steps.cache-thirdparty.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: D:\TBuild\ThirdParty
          key: ayugram-win64-thirdparty-${{ env.DEPENDENCY_KEY }}

      - name: Save libraries cache
        if: always() && steps.prepare.outcome == 'success' && steps.cache-libraries.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: D:\TBuild\Libraries\win64
          key: ayugram-win64-libraries-${{ env.DEPENDENCY_KEY }}

      - name: Work around MSVC debug-info CMake issue
        shell: bash
        run: |
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

      - name: Configure and build AyuGram
        run: |
          cd /d "%TBUILD%\%REPO_NAME%\Telegram"
          call configure.bat ^
            -G "Ninja Multi-Config" ^
            x64 ^
            -D TDESKTOP_API_ID=%API_ID% ^
            -D TDESKTOP_API_HASH=%API_HASH% ^
            -D CMAKE_CONFIGURATION_TYPES=Release ^
            -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
            -D DESKTOP_APP_ENABLE_LTO=OFF
          if errorlevel 1 exit /b 1
          cmake --build ..\out --config Release --target Telegram --parallel 3
          if errorlevel 1 exit /b 1

      - name: Package portable build
        shell: pwsh
        run: |
          $out = Join-Path $env:TBUILD "$env:REPO_NAME\out\Release"
          $exe = @((Join-Path $out 'AyuGram.exe'), (Join-Path $out 'Telegram.exe')) |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $exe) { throw "AyuGram.exe was not found under $out" }

          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $dist 'AyuGram.exe')
          Set-Content -Path (Join-Path $dist 'version.txt') -Value $env:GITHUB_SHA -Encoding ascii
          $portable = Join-Path $dist 'TelegramForcePortable'
          New-Item -ItemType Directory -Path $portable | Out-Null
          Set-Content -Path (Join-Path $portable 'README.txt') -Value 'This folder keeps this custom build data separate from the regular Telegram/AyuGram installation.' -Encoding utf8

          $zip = Join-Path $env:GITHUB_WORKSPACE 'AyuGram-Windows-x64.zip'
          Compress-Archive -Path (Join-Path $dist '*') -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AyuGram-Windows-x64.zip" | Set-Content -Path "$zip.sha256" -Encoding ascii
          Get-Item $zip, "$zip.sha256" | Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AyuGram-Windows-x64
          path: |
            AyuGram-Windows-x64.zip
            AyuGram-Windows-x64.zip.sha256
          retention-days: 7
